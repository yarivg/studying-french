<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Carnet — a French course</title>
<meta name="description" content="A self-made French course: pronunciation, grammar A1 through B2, 1500-word vocabulary browser and spaced-repetition flashcards.">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🇫🇷</text></svg>">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Le&nbsp;Carnet<small>français</small></span>
  </a>
  <div class="topbar-search">
    <input type="search" id="globalSearch" placeholder="Search lessons and vocabulary…" autocomplete="off" spellcheck="false" aria-label="Search">
    <kbd>/</kbd>
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Course contents">
    <div class="progress-card">
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="ring-bg" cx="22" cy="22" r="19"/>
        <circle class="ring-fg" id="progressRing" cx="22" cy="22" r="19"/>
      </svg>
      <div class="progress-meta">
        <strong id="progressPct">0%</strong>
        <span id="progressText">nothing read yet</span>
      </div>
    </div>
    <div id="nav"></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main id="main" tabindex="-1">
    <article id="view" class="prose"></article>
    <nav class="pager" id="pager" aria-label="Lesson navigation"></nav>
  </main>
</div>

<script src="assets/md.js"></script>
<script src="assets/progress.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/vocab.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
